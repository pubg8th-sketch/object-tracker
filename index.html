<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>사물 지정 자동 줌 중계 시스템</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0b0b;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }
        h2 {
            margin: 10px 0 5px 0;
            font-size: 1.2rem;
            color: #00FFCC;
            text-align: center;
        }
        .controls {
            margin-bottom: 8px;
            display: flex;
            gap: 8px;
        }
        button {
            background-color: #00FFCC;
            color: #111;
            font-weight: bold;
            border: none;
            padding: 8px 14px;
            font-size: 0.85rem;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,255,204,0.3);
        }
        button:active {
            transform: scale(0.95);
        }
        .viewport {
            position: relative;
            width: 640px;
            height: 480px;
            max-width: 95vw;
            max-height: 70vh;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #333;
            background: #000;
        }
        #displayCanvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: crosshair;
        }
        video, #processingCanvas {
            display: none;
        }
        .badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(0, 255, 204, 0.8);
            color: #000;
            padding: 4px 8px;
            font-size: 0.75rem;
            font-weight: bold;
            border-radius: 4px;
            letter-spacing: 1px;
        }
        .info {
            margin-top: 8px;
            font-size: 0.85rem;
            color: #888;
            text-align: center;
            padding: 0 10px;
        }
    </style>
</head>
<body>

    <h2>사물 지정 자동 줌 중계</h2>
    <div class="controls">
        <button id="switchCameraBtn">카메라 전환</button>
    </div>
    <div class="viewport">
        <div class="badge" id="statusBadge">터치하여 사물 선택</div>
        <canvas id="displayCanvas"></canvas>
    </div>
    <div class="info">화면에서 따라가고 싶은 사물을 터치하세요.</div>

    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="processingCanvas"></canvas>

    <script>
        const video = document.getElementById('webcam');
        const procCanvas = document.getElementById('processingCanvas');
        const procCtx = procCanvas.getContext('2d');
        const dispCanvas = document.getElementById('displayCanvas');
        const dispCtx = dispCanvas.getContext('2d');
        const switchBtn = document.getElementById('switchCameraBtn');
        const statusBadge = document.getElementById('statusBadge');

        let currentStream = null;
        let useFrontCamera = false; // 기본값을 후면(false)으로 우선 시도
        let videoDevices = [];
        let currentDeviceIndex = 0;

        let targetColor = null;
        let trackedObject = null;

        let currentCamX = 320;
        let currentCamY = 240;
        let currentZoom = 1.0;

        // 기기에서 사용 가능한 카메라 장치 목록 가져오기
        async function getCameraDevices() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                videoDevices = devices.filter(device => device.kind === 'videoinput');
                console.log("발견된 카메라 목록:", videoDevices);
            } catch (err) {
                console.error("카메라 장치 목록을 가져오지 못했습니다.", err);
            }
        }

        async function startCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            let constraints;

            // 기기 목록이 있고 후면/전면 명시가 확실할 때
            if (videoDevices.length > 0) {
                // facingMode 대신 deviceId를 직접 지정하거나 순서대로 변경
                let targetDevice = videoDevices[currentDeviceIndex];
                constraints = {
                    video: {
                        deviceId: targetDevice ? { exact: targetDevice.deviceId } : undefined,
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    }
                };
            } else {
                // 기본 제약 조건 (environment: 후면, user: 전면)
                constraints = {
                    video: {
                        width: { ideal: 640 },
                        height: { ideal: 480 },
                        facingMode: useFrontCamera ? 'user' : { exact: 'environment' }
                    }
                };
            }

            try {
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
            } catch (e) {
                console.warn("정밀 제약 조건 실패, 유연한 모드로 재시도합니다.", e);
                // 강제 옵션에서 실패할 경우 일반 모드로 재시도
                try {
                    constraints = {
                        video: {
                            width: { ideal: 640 },
                            height: { ideal: 480 },
                            facingMode: useFrontCamera ? 'user' : 'environment'
                        }
                    };
                    currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                } catch (err) {
                    alert("카메라를 실행할 수 없습니다. 카메라 권한을 확인해주세요.");
                    console.error(err);
                    return;
                }
            }

            video.srcObject = currentStream;
            return new Promise((resolve) => {
                video.onloadedmetadata = () => {
                    procCanvas.width = video.videoWidth;
                    procCanvas.height = video.videoHeight;
                    dispCanvas.width = video.videoWidth;
                    dispCanvas.height = video.videoHeight;
                    currentCamX = video.videoWidth / 2;
                    currentCamY = video.videoHeight / 2;
                    resolve();
                };
            });
        }

        // 카메라 전환 버튼 (목록이 있으면 순회, 없으면 토글)
        switchBtn.addEventListener('click', async () => {
            targetColor = null;
            trackedObject = null;
            statusBadge.innerText = "터치하여 사물 선택";
            statusBadge.style.background = "rgba(0, 255, 204, 0.8)";

            if (videoDevices.length > 1) {
                currentDeviceIndex = (currentDeviceIndex + 1) % videoDevices.length;
            } else {
                useFrontCamera = !useFrontCamera;
            }
            await startCamera();
        });

        // 사물 터치 지정
        function handleTouchOrClick(clientX, clientY) {
            const rect = dispCanvas.getBoundingClientRect();
            const scaleX = dispCanvas.width / rect.width;
            const scaleY = dispCanvas.height / rect.height;

            const viewW = dispCanvas.width / currentZoom;
            const viewH = dispCanvas.height / currentZoom;
            const viewX = currentCamX - viewW / 2;
            const viewY = currentCamY - viewH / 2;

            const clickX = viewX + (clientX - rect.left) * scaleX * (viewW / dispCanvas.width);
            const clickY = viewY + (clientY - rect.top) * scaleY * (viewH / dispCanvas.height);

            const sampleSize = 5;
            const startX = Math.max(0, Math.floor(clickX - sampleSize));
            const startY = Math.max(0, Math.floor(clickY - sampleSize));
            const pWidth = sampleSize * 2;
            const pHeight = sampleSize * 2;

            const pixelData = procCtx.getImageData(startX, startY, pWidth, pHeight).data;
            let rSum = 0, gSum = 0, bSum = 0, total = 0;

            for (let i = 0; i < pixelData.length; i += 4) {
                rSum += pixelData[i];
                gSum += pixelData[i+1];
                bSum += pixelData[i+2];
                total++;
            }

            targetColor = { r: rSum / total, g: gSum / total, b: bSum / total };
            trackedObject = { x: clickX, y: clickY };

            statusBadge.innerText = "● TRACKING ACTIVE";
            statusBadge.style.background = "rgba(255, 0, 0, 0.8)";
        }

        dispCanvas.addEventListener('click', (e) => handleTouchOrClick(e.clientX, e.clientY));
        dispCanvas.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) {
                handleTouchOrClick(e.touches[0].clientX, e.touches[0].clientY);
                e.preventDefault();
            }
        }, { passive: false });

        // 메인 추적 루프
        function processFrame() {
            if (video.paused || video.ended) return;

            const width = procCanvas.width;
            const height = procCanvas.height;

            procCtx.drawImage(video, 0, 0, width, height);
            const frame = procCtx.getImageData(0, 0, width, height);
            const data = frame.data;

            let targetX = currentCamX;
            let targetY = currentCamY;
            let targetZoom = 1.0;

            if (targetColor && trackedObject) {
                let sumX = 0, sumY = 0, count = 0;
                const colorThreshold = 75;
                const searchRadius = 120;

                const startX = Math.max(0, Math.floor(trackedObject.x - searchRadius));
                const endX = Math.min(width, Math.floor(trackedObject.x + searchRadius));
                const startY = Math.max(0, Math.floor(trackedObject.y - searchRadius));
                const endY = Math.min(height, Math.floor(trackedObject.y + searchRadius));

                for (let y = startY; y < endY; y += 3) {
                    for (let x = startX; x < endX; x += 3) {
                        let idx = (y * width + x) * 4;
                        let r = data[idx];
                        let g = data[idx + 1];
                        let b = data[idx + 2];

                        let diff = Math.abs(r - targetColor.r) + Math.abs(g - targetColor.g) + Math.abs(b - targetColor.b);
                        if (diff < colorThreshold) {
                            sumX += x;
                            sumY += y;
                            count++;
                        }
                    }
                }

                if (count > 15) {
                    targetX = sumX / count;
                    targetY = sumY / count;
                    trackedObject = { x: targetX, y: targetY };
                    targetZoom = 2.0;
                } else {
                    targetX = trackedObject.x;
                    targetY = trackedObject.y;
                    targetZoom = 2.0;
                }
            } else {
                targetX = width / 2;
                targetY = height / 2;
                targetZoom = 1.0;
            }

            const ease = 0.1;
            currentCamX += (targetX - currentCamX) * ease;
            currentCamY += (targetY - currentCamY) * ease;
            currentZoom += (targetZoom - currentZoom) * ease;

            let cropW = width / currentZoom;
            let cropH = height / currentZoom;
            let cropX = currentCamX - cropW / 2;
            let cropY = currentCamY - cropH / 2;

            cropX = Math.max(0, Math.min(width - cropW, cropX));
            cropY = Math.max(0, Math.min(height - cropH, cropY));

            dispCtx.clearRect(0, 0, width, height);
            dispCtx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, width, height);

            requestAnimationFrame(processFrame);
        }

        // 초기 실행 시 카메라 장치 목록을 먼저 조회한 후 카메라 구동
        async function init() {
            await getCameraDevices();
            // 후면 카메라가 목록에 있다면 첫 번째로 지정
            if (videoDevices.length > 1) {
                // 보통 후면 카메라는 목록의 두 번째나 'back'이 포함된 장치일 확률이 높음
                const backIndex = videoDevices.findIndex(d => d.label.toLowerCase().find(k => k.includes('back') || k.includes('후면') || k.includes('rear')));
                if (backIndex !== -1) {
                    currentDeviceIndex = backIndex;
                }
            }
            await startCamera();
            requestAnimationFrame(processFrame);
        }

        init();
    </script>
</body>
</html>
