<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>물체 지정 및 카메라 전환 추적</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h2 {
            margin-bottom: 5px;
            font-size: 1.4rem;
            color: #4CAF50;
        }
        .controls {
            margin-bottom: 10px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 0.9rem;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .container {
            position: relative;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #333;
            cursor: crosshair;
        }
        video, canvas {
            display: block;
            width: 640px;
            height: 480px;
            max-width: 100%;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
        }
        .info {
            margin-top: 10px;
            font-size: 0.85rem;
            color: #aaa;
            text-align: center;
            padding: 0 10px;
        }
    </style>
</head>
<body>

    <h2>실시간 물체 지정 및 예상 경로 추적</h2>
    <div class="controls">
        <button id="switchCameraBtn">카메라 전환 (전면/후면)</button>
    </div>
    <div class="container" id="videoContainer">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="outputCanvas"></canvas>
    </div>
    <div class="info">화면을 <strong>터치(클릭)</strong>하여 추적할 물체를 지정하세요. (붉은 점: 예상 이동 경로)</div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('outputCanvas');
        const ctx = canvas.getContext('2d');
        const switchBtn = document.getElementById('switchCameraBtn');
        const container = document.getElementById('videoContainer');

        let currentStream = null;
        let useFrontCamera = true; // 기본 전면/후면 토글 상태
        
        let targetColor = null; // 사용자가 선택한 물체의 색상 정보 (RGB)
        let trackedObject = null; // 현재 추적 중인 물체의 위치 {x, y}
        let historyPoints = []; // 최근 위치 기록

        // 카메라 시작 함수
        async function startCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            const constraints = {
                video: {
                    width: { ideal: 640 },
                    height: { ideal: 480 },
                    facingMode: useFrontCamera ? 'user' : 'environment' // user: 전면, environment: 후면
                }
            };

            try {
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;
                return new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        resolve();
                    };
                });
            } catch (err) {
                alert("카메라 접근 권한이 없거나 지원하지 않는 기기입니다.");
                console.error(err);
            }
        }

        // 카메라 전환 버튼 이벤트
        switchBtn.addEventListener('click', async () => {
            useFrontCamera = !useFrontCamera;
            targetColor = null; // 카메라가 바뀌면 지정했던 물체 초기화
            trackedObject = null;
            historyPoints = [];
            await startCamera();
        });

        // 화면 클릭(터치) 시 해당 위치의 색상을 추출하여 추적 목표로 설정
        container.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            // 화면 상의 좌표를 실제 캔버스 해상도에 맞게 변환
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            const clickX = (e.clientX - rect.left) * scaleX;
            const clickY = (e.clientY - rect.top) * scaleY;

            // 클릭한 지점의 픽셀 색상 가져오기
            const pixelData = ctx.getImageData(Math.floor(clickX), Math.floor(clickY), 1, 1).data;
            targetColor = { r: pixelData[0], g: pixelData[1], b: pixelData[2] };
            trackedObject = { x: clickX, y: clickY };
            historyPoints = [{ x: clickX, y: clickY }];
            
            console.log("물체 지정됨 (RGB):", targetColor);
        });

        // 매 프레임마다 영상 분석 및 추적 수행
        function processVideo() {
            if (video.paused || video.ended) return;

            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            if (targetColor) {
                const frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = frame.data;
                const width = canvas.width;
                const height = canvas.height;

                let sumX = 0, sumY = 0, count = 0;
                const colorThreshold = 60; // 색상 유사도 허용 오차 범위

                // 이전에 찾은 위치 주변을 우선적으로 탐색 (빠른 추적)
                const searchRadius = 80;
                const startX = trackedObject ? Math.max(0, Math.floor(trackedObject.x - searchRadius)) : 0;
                const endX = trackedObject ? Math.min(width, Math.floor(trackedObject.x + searchRadius)) : width;
                const startY = trackedObject ? Math.max(0, Math.floor(trackedObject.y - searchRadius)) : 0;
                const endY = trackedObject ? Math.min(height, Math.floor(trackedObject.y + searchRadius)) : height;

                for (let y = startY; y < endY; y += 3) {
                    for (let x = startX; x < endX; x += 3) {
                        let idx = (y * width + x) * 4;
                        let r = data[idx];
                        let g = data[idx + 1];
                        let b = data[idx + 2];

                        // 지정한 색상과의 오차 계산
                        let diff = Math.abs(r - targetColor.r) + Math.abs(g - targetColor.g) + Math.abs(b - targetColor.b);
                        if (diff < colorThreshold) {
                            sumX += x;
                            sumY += y;
                            count++;
                        }
                    }
                }

                // 물체를 찾은 경우
                if (count > 20) {
                    let cx = sumX / count;
                    let cy = sumY / count;
                    trackedObject = { x: cx, y: cy };

                    historyPoints.push({ x: cx, y: cy });
                    if (historyPoints.length > 8) {
                        historyPoints.shift();
                    }
                }
            }

            drawVisualizations();
            requestAnimationFrame(processVideo);
        }

        // 시각화 (현재 선택된 물체 및 붉은 점 예상 경로 표시)
        function drawVisualizations() {
            if (historyPoints.length > 0) {
                let current = historyPoints[historyPoints.length - 1];

                // 1. 현재 추적 중인 물체 위치 (초록색 테두리 원)
                ctx.beginPath();
                ctx.arc(current.x, current.y, 14, 0, 2 * Math.PI);
                ctx.strokeStyle = '#00FF00';
                ctx.lineWidth = 3;
                ctx.stroke();

                if (historyPoints.length >= 2) {
                    // 2. 속도 및 방향 벡터 계산
                    let dx = 0, dy = 0;
                    for (let i = 1; i < historyPoints.length; i++) {
                        dx += historyPoints[i].x - historyPoints[i-1].x;
                        dy += historyPoints[i].y - historyPoints[i-1].y;
                    }
                    dx /= (historyPoints.length - 1);
                    dy /= (historyPoints.length - 1);

                    // 3. 미래 예상 경로를 붉은 점으로 표시
                    const predictionSteps = 12;
                    for (let step = 1; step <= predictionSteps; step++) {
                        let predX = current.x + dx * step * 1.5;
                        let predY = current.y + dy * step * 1.5;

                        ctx.beginPath();
                        ctx.arc(predX, predY, 4 + step * 0.3, 0, 2 * Math.PI);
                        ctx.fillStyle = `rgba(255, 0, 0, ${1 - step / (predictionSteps + 2)})`;
                        ctx.fill();
                    }
                }
            }
        }

        // 초기 실행
        startCamera().then(() => {
            requestAnimationFrame(processVideo);
        });
    </script>
</body>
</html>
