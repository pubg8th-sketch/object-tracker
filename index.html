<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>터치 기반 물체 지정 및 예상 경로 추적</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            touch-action: manipulation;
        }
        h2 {
            margin-bottom: 5px;
            font-size: 1.3rem;
            color: #4CAF50;
            text-align: center;
        }
        .controls {
            margin-bottom: 10px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        button:active {
            background-color: #388E3C;
        }
        .container {
            position: relative;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #333;
        }
        video, canvas {
            display: block;
            width: 100%;
            max-width: 640px;
            height: auto;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .info {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #aaa;
            text-align: center;
            padding: 0 15px;
        }
    </style>
</head>
<body>

    <h2>물체 지정 및 예상 경로 추적</h2>
    <div class="controls">
        <button id="switchCameraBtn">카메라 전환 (전면/후면)</button>
    </div>
    <div class="container" id="videoContainer">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="outputCanvas"></canvas>
    </div>
    <div class="info">화면의 움직일 물체를 <strong>손가락으로 톡 터치</strong>하세요! (초록색 테두리: 지정된 물체 / 붉은 점: 예상 경로)</div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('outputCanvas');
        const ctx = canvas.getContext('2d');
        const switchBtn = document.getElementById('switchCameraBtn');
        const container = document.getElementById('videoContainer');

        let currentStream = null;
        let useFrontCamera = true; // 전면/후면 토글 상태
        
        let targetColor = null; 
        let trackedObject = null; 
        let historyPoints = []; 

        // 카메라 시작 함수
        async function startCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            const constraints = {
                video: {
                    width: { ideal: 640 },
                    height: { ideal: 480 },
                    facingMode: useFrontCamera ? 'user' : 'environment'
                }
            };

            try {
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;
                return new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        resolve();
                    };
                });
            } catch (err) {
                alert("카메라 권한이 없거나 지원하지 않는 기기입니다.");
                console.error(err);
            }
        }

        // 카메라 전환 버튼
        switchBtn.addEventListener('click', async () => {
            useFrontCamera = !useFrontCamera;
            targetColor = null; 
            trackedObject = null;
            historyPoints = [];
            await startCamera();
        });

        // 태블릿 터치 및 마우스 클릭 이벤트 공통 처리 함수
        function handleTouchOrClick(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            
            // 화면에 표시된 크기와 실제 비디오 해상도 비율 계산
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            const clickX = (clientX - rect.left) * scaleX;
            const clickY = (clientY - rect.top) * scaleY;

            // 터치한 위치의 실제 비디오 프레임 색상 가져오기
            const pixelData = ctx.getImageData(Math.floor(clickX), Math.floor(clickY), 1, 1).data;
            targetColor = { r: pixelData[0], g: pixelData[1], b: pixelData[2] };
            trackedObject = { x: clickX, y: clickY };
            historyPoints = [{ x: clickX, y: clickY }];
        }

        // 마우스 클릭 지원
        container.addEventListener('click', (e) => {
            handleTouchOrClick(e.clientX, e.clientY);
        });

        // 태블릿/모바일 터치 지원 (터치 순간 즉시 반응)
        container.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) {
                const touch = e.touches[0];
                handleTouchOrClick(touch.clientX, touch.clientY);
                e.preventDefault(); // 화면 스크롤 방지
            }
        }, { passive: false });

        // 실시간 비디오 분석 및 추적 루프
        function processVideo() {
            if (video.paused || video.ended) return;

            // 비디오 프레임을 캔버스에 그리기
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            if (targetColor) {
                const frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = frame.data;
                const width = canvas.width;
                const height = canvas.height;

                let sumX = 0, sumY = 0, count = 0;
                const colorThreshold = 55; // 색상 유사도 판정 범위

                // 직전 위치 주변을 우선 탐색하여 속도 향상
                const searchRadius = 90;
                const startX = trackedObject ? Math.max(0, Math.floor(trackedObject.x - searchRadius)) : 0;
                const endX = trackedObject ? Math.min(width, Math.floor(trackedObject.x + searchRadius)) : width;
                const startY = trackedObject ? Math.max(0, Math.floor(trackedObject.y - searchRadius)) : 0;
                const endY = trackedObject ? Math.min(height, Math.floor(trackedObject.y + searchRadius)) : height;

                for (let y = startY; y < endY; y += 3) {
                    for (let x = startX; x < endX; x += 3) {
                        let idx = (y * width + x) * 4;
                        let r = data[idx];
                        let g = data[idx + 1];
                        let b = data[idx + 2];

                        let diff = Math.abs(r - targetColor.r) + Math.abs(g - targetColor.g) + Math.abs(b - targetColor.b);
                        if (diff < colorThreshold) {
                            sumX += x;
                            sumY += y;
                            count++;
                        }
                    }
                }

                // 지정한 색상의 물체가 감지된 경우
                if (count > 25) {
                    let cx = sumX / count;
                    let cy = sumY / count;
                    trackedObject = { x: cx, y: cy };

                    historyPoints.push({ x: cx, y: cy });
                    if (historyPoints.length > 8) {
                        historyPoints.shift();
                    }
                }
            }

            drawVisualizations();
            requestAnimationFrame(processVideo);
        }

        // 화면에 초록색 테두리와 붉은 점(예상 경로) 그리기
        function drawVisualizations() {
            if (historyPoints.length > 0) {
                let current = historyPoints[historyPoints.length - 1];

                // 1. 현재 물체 위치 (초록색 원)
                ctx.beginPath();
                ctx.arc(current.x, current.y, 16, 0, 2 * Math.PI);
                ctx.strokeStyle = '#00FF00';
                ctx.lineWidth = 3;
                ctx.stroke();

                if (historyPoints.length >= 2) {
                    // 2. 이동 방향 및 속도 계산
                    let dx = 0, dy = 0;
                    for (let i = 1; i < historyPoints.length; i++) {
                        dx += historyPoints[i].x - historyPoints[i-1].x;
                        dy += historyPoints[i].y - historyPoints[i-1].y;
                    }
                    dx /= (historyPoints.length - 1);
                    dy /= (historyPoints.length - 1);

                    // 3. 미래 예상 경로를 붉은 점으로 표시
                    const predictionSteps = 12;
                    for (let step = 1; step <= predictionSteps; step++) {
                        let predX = current.x + dx * step * 1.5;
                        let predY = current.y + dy * step * 1.5;

                        ctx.beginPath();
                        ctx.arc(predX, predY, 4 + step * 0.3, 0, 2 * Math.PI);
                        ctx.fillStyle = `rgba(255, 0, 0, ${1 - step / (predictionSteps + 2)})`;
                        ctx.fill();
                    }
                }
            }
        }

        // 실행 시작
        startCamera().then(() => {
            requestAnimationFrame(processVideo);
        });
    </script>
</body>
</html>
