<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>고화질 사물 자동 줌 중계 시스템</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0b0b;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }
        h2 {
            margin: 10px 0 5px 0;
            font-size: 1.2rem;
            color: #00FFCC;
            text-align: center;
        }
        .controls {
            margin-bottom: 8px;
            display: flex;
            gap: 8px;
        }
        button {
            background-color: #00FFCC;
            color: #111;
            font-weight: bold;
            border: none;
            padding: 8px 14px;
            font-size: 0.85rem;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,255,204,0.3);
        }
        button#cancelBtn {
            background-color: #FF5555;
            color: #fff;
            display: none; /* 평소에는 숨김 */
        }
        button:active {
            transform: scale(0.95);
        }
        .viewport {
            position: relative;
            width: 720px;
            height: 540px;
            max-width: 95vw;
            max-height: 70vh;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #333;
            background: #000;
        }
        #displayCanvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: crosshair;
        }
        video, #processingCanvas {
            display: none;
        }
        .badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(0, 255, 204, 0.8);
            color: #000;
            padding: 4px 8px;
            font-size: 0.75rem;
            font-weight: bold;
            border-radius: 4px;
        }
        .info {
            margin-top: 8px;
            font-size: 0.85rem;
            color: #888;
            text-align: center;
            padding: 0 10px;
        }
    </style>
</head>
<body>

    <h2>고화질 사물 지정 자동 줌 중계</h2>
    <div class="controls">
        <button id="switchCameraBtn">카메라 전환</button>
        <button id="cancelBtn">추적 취소 (기본화면)</button>
    </div>
    <div class="viewport">
        <div class="badge" id="statusBadge">터치하여 사물 선택</div>
        <canvas id="displayCanvas"></canvas>
    </div>
    <div class="info">화면을 터치해 사물을 지정하세요. 상단의 '추적 취소'로 언제든 기본 화면으로 돌아갈 수 있습니다.</div>

    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="processingCanvas"></canvas>

    <script>
        const video = document.getElementById('webcam');
        const procCanvas = document.getElementById('processingCanvas');
        const procCtx = procCanvas.getContext('2d');
        const dispCanvas = document.getElementById('displayCanvas');
        const dispCtx = dispCanvas.getContext('2d');
        const switchBtn = document.getElementById('switchCameraBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const statusBadge = document.getElementById('statusBadge');

        let currentStream = null;
        let useFrontCamera = true;

        let targetColor = null;
        let trackedObject = null;

        let currentCamX = 640;
        let currentCamY = 360;
        let currentZoom = 1.0;

        async function startCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            let constraints = {
                video: {
                    width: { ideal: 1280 }, // 고화질 HD 해상도 요청
                    height: { ideal: 720 },
                    facingMode: useFrontCamera ? 'user' : { exact: 'environment' }
                }
            };

            try {
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
            } catch (err) {
                console.warn("후면 카메라 실행 실패, 전면으로 대체", err);
                useFrontCamera = true;
                constraints = {
                    video: {
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                        facingMode: 'user'
                    }
                };
                try {
                    currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                } catch (e) {
                    alert("카메라를 실행할 수 없습니다. 권한을 확인해주세요.");
                    return;
                }
            }

            video.srcObject = currentStream;
            return new Promise((resolve) => {
                video.onloadedmetadata = () => {
                    // 실제 비디오 해상도 반영 (고화질)
                    const vWidth = video.videoWidth || 1280;
                    const vHeight = video.videoHeight || 720;

                    procCanvas.width = vWidth;
                    procCanvas.height = vHeight;
                    dispCanvas.width = vWidth;
                    dispCanvas.height = vHeight;

                    currentCamX = vWidth / 2;
                    currentCamY = vHeight / 2;
                    resolve();
                };
            });
        }

        switchBtn.addEventListener('click', async () => {
            useFrontCamera = !useFrontCamera;
            resetTracking();
            await startCamera();
        });

        // 추적 취소 버튼 기능
        cancelBtn.addEventListener('click', () => {
            resetTracking();
        });

        function resetTracking() {
            targetColor = null;
            trackedObject = null;
            currentZoom = 1.0;
            statusBadge.innerText = "터치하여 사물 선택";
            statusBadge.style.background = "rgba(0, 255, 204, 0.8)";
            cancelBtn.style.display = "none"; // 취소 버튼 숨김
        }

        function handleTouchOrClick(clientX, clientY) {
            const rect = dispCanvas.getBoundingClientRect();
            const scaleX = dispCanvas.width / rect.width;
            const scaleY = dispCanvas.height / rect.height;

            const viewW = dispCanvas.width / currentZoom;
            const viewH = dispCanvas.height / currentZoom;
            const viewX = currentCamX - viewW / 2;
            const viewY = currentCamY - viewH / 2;

            const clickX = viewX + (clientX - rect.left) * scaleX * (viewW / dispCanvas.width);
            const clickY = viewY + (clientY - rect.top) * scaleY * (viewH / dispCanvas.height);

            const sampleSize = 6;
            const startX = Math.max(0, Math.floor(clickX - sampleSize));
            const startY = Math.max(0, Math.floor(clickY - sampleSize));
            const pWidth = sampleSize * 2;
            const pHeight = sampleSize * 2;

            const pixelData = procCtx.getImageData(startX, startY, pWidth, pHeight).data;
            let rSum = 0, gSum = 0, bSum = 0, total = 0;

            for (let i = 0; i < pixelData.length; i += 4) {
                rSum += pixelData[i];
                gSum += pixelData[i+1];
                bSum += pixelData[i+2];
                total++;
            }

            targetColor = { r: rSum / total, g: gSum / total, b: bSum / total };
            trackedObject = { x: clickX, y: clickY };

            statusBadge.innerText = "● TRACKING ACTIVE";
            statusBadge.style.background = "rgba(255, 0, 0, 0.8)";
            cancelBtn.style.display = "inline-block"; // 취소 버튼 표시
        }

        dispCanvas.addEventListener('click', (e) => {
            handleTouchOrClick(e.clientX, e.clientY);
        });

        dispCanvas.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) {
                const touch = e.touches[0];
                handleTouchOrClick(touch.clientX, touch.clientY);
                e.preventDefault();
            }
        }, { passive: false });

        function processFrame() {
            if (video.paused || video.ended) return;

            const width = procCanvas.width;
            const height = procCanvas.height;

            procCtx.drawImage(video, 0, 0, width, height);
            const frame = procCtx.getImageData(0, 0, width, height);
            const data = frame.data;

            let targetX = currentCamX;
            let targetY = currentCamY;
            let targetZoom = 1.0;

            if (targetColor && trackedObject) {
                let sumX = 0, sumY = 0, count = 0;
                const colorThreshold = 75;
                const searchRadius = 180; // 고화질에 맞춰 탐색 반경 확대

                const startX = Math.max(0, Math.floor(trackedObject.x - searchRadius));
                const endX = Math.min(width, Math.floor(trackedObject.x + searchRadius));
                const startY = Math.max(0, Math.floor(trackedObject.y - searchRadius));
                const endY = Math.min(height, Math.floor(trackedObject.y + searchRadius));

                for (let y = startY; y < endY; y += 4) {
                    for (let x = startX; x < endX; x += 4) {
                        let idx = (y * width + x) * 4;
                        let r = data[idx];
                        let g = data[idx + 1];
                        let b = data[idx + 2];

                        let diff = Math.abs(r - targetColor.r) + Math.abs(g - targetColor.g) + Math.abs(b - targetColor.b);
                        if (diff < colorThreshold) {
                            sumX += x;
                            sumY += y;
                            count++;
                        }
                    }
                }

                if (count > 20) {
                    targetX = sumX / count;
                    targetY = sumY / count;
                    trackedObject = { x: targetX, y: targetY };
                    targetZoom = 2.2; // 고화질 상태에서 깔끔하게 확대
                } else {
                    targetX = trackedObject.x;
                    targetY = trackedObject.y;
                    targetZoom = 2.2;
                }
            } else {
                targetX = width / 2;
                targetY = height / 2;
                targetZoom = 1.0;
            }

            const ease = 0.1;
            currentCamX += (targetX - currentCamX) * ease;
            currentCamY += (targetY - currentCamY) * ease;
            currentZoom += (targetZoom - currentZoom) * ease;

            let cropW = width / currentZoom;
            let cropH = height / currentZoom;
            let cropX = currentCamX - cropW / 2;
            let cropY = currentCamY - cropH / 2;

            cropX = Math.max(0, Math.min(width - cropW, cropX));
            cropY = Math.max(0, Math.min(height - cropH, cropY));

            dispCtx.clearRect(0, 0, width, height);
            dispCtx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, width, height);

            requestAnimationFrame(processFrame);
        }

        startCamera().then(() => {
            requestAnimationFrame(processVideo);
        });
    </script>
</body>
</html>
