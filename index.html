<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AI 스마트 자동 줌 중계 시스템</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0b0b;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h2 {
            margin: 10px 0 5px 0;
            font-size: 1.2rem;
            color: #FFD700;
            text-shadow: 0 0 5px rgba(255,215,0,0.5);
        }
        .controls {
            margin-bottom: 10px;
        }
        button {
            background-color: #FFD700;
            color: #111;
            font-weight: bold;
            border: none;
            padding: 8px 16px;
            font-size: 0.9rem;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255,215,0,0.3);
        }
        button:active {
            transform: scale(0.95);
        }
        .viewport {
            position: relative;
            width: 640px;
            height: 480px;
            max-width: 95vw;
            max-height: 70vh;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #333;
            background: #000;
        }
        /* 메인 화면 캔버스 */
        #displayCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        /* 연산을 위한 백그라운드 비디오/캔버스 (숨김) */
        video, #processingCanvas {
            display: none;
        }
        .badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(255, 0, 0, 0.8);
            color: white;
            padding: 4px 8px;
            font-size: 0.75rem;
            font-weight: bold;
            border-radius: 4px;
            letter-spacing: 1px;
            animation: blink 1.5s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .info {
            margin-top: 10px;
            font-size: 0.85rem;
            color: #888;
            text-align: center;
        }
    </style>
</head>
<body>

    <h2>방송 중계 스타일 스마트 자동 줌</h2>
    <div class="controls">
        <button id="switchCameraBtn">카메라 전환 (전면/후면)</button>
    </div>
    <div class="viewport">
        <div class="badge">● AUTO TRACKING</div>
        <canvas id="displayCanvas"></canvas>
    </div>
    <div class="info">움직이는 물체/사람을 자동으로 따라가며 크롭 및 줌인합니다.</div>

    <!-- 비공개 연산용 엘리먼트 -->
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="processingCanvas"></canvas>

    <script>
        const video = document.getElementById('webcam');
        const procCanvas = document.getElementById('processingCanvas');
        const procCtx = procCanvas.getContext('2d');
        const dispCanvas = document.getElementById('displayCanvas');
        const dispCtx = dispCanvas.getContext('2d');
        const switchBtn = document.getElementById('switchCameraBtn');

        let currentStream = null;
        let useFrontCamera = true;
        let prevGray = null;

        // 부드러운 카메라 이동을 위한 보정(Smoothening) 변수
        let currentCamX = 320;
        let currentCamY = 240;
        let currentZoom = 1.0;

        async function startCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            const constraints = {
                video: {
                    width: { ideal: 640 },
                    height: { ideal: 480 },
                    facingMode: useFrontCamera ? 'user' : 'environment'
                }
            };

            try {
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;
                return new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        procCanvas.width = video.videoWidth;
                        procCanvas.height = video.videoHeight;
                        dispCanvas.width = video.videoWidth;
                        dispCanvas.height = video.videoHeight;
                        currentCamX = video.videoWidth / 2;
                        currentCamY = video.videoHeight / 2;
                        resolve();
                    };
                });
            } catch (err) {
                alert("카메라 권한을 얻을 수 없습니다.");
            }
        }

        switchBtn.addEventListener('click', async () => {
            useFrontCamera = !useFrontCamera;
            prevGray = null;
            await startCamera();
        });

        function processFrame() {
            if (video.paused || video.ended) return;

            const width = procCanvas.width;
            const height = procCanvas.height;

            // 원본 비디오를 처리용 캔버스에 그리기
            procCtx.drawImage(video, 0, 0, width, height);
            const frame = procCtx.getImageData(0, 0, width, height);
            const data = frame.data;

            // 프레임 차분법을 위한 흑백(Gray Scale) 데이터 생성 (4픽셀 축소 샘플링)
            const gray = new Uint8Array((width * height) / 16);
            for (let y = 0, gIdx = 0; y < height; y += 4) {
                for (let x = 0; x < width; x += 4) {
                    let idx = (y * width + x) * 4;
                    gray[gIdx++] = (data[idx] * 0.299 + data[idx + 1] * 0.587 + data[idx + 2] * 0.114);
                }
            }

            let targetX = currentCamX;
            let targetY = currentCamY;
            let targetZoom = 1.0;

            if (prevGray) {
                let sumX = 0, sumY = 0, count = 0;
                let minX = width, maxX = 0, minY = height, maxY = 0;
                const threshold = 25; // 움직임 임계값

                for (let y = 0, gIdx = 0; y < height; y += 4) {
                    for (let x = 0; x < width; x += 4) {
                        let diff = Math.abs(gray[gIdx] - prevGray[gIdx]);
                        if (diff > threshold) {
                            sumX += x;
                            sumY += y;
                            count++;
                            if (x < minX) minX = x;
                            if (x > maxX) maxX = x;
                            if (y < minY) minY = y;
                            if (y > maxY) maxY = y;
                        }
                        gIdx++;
                    }
                }

                // 의미 있는 움직임이 감지된 경우
                if (count > 30) {
                    targetX = sumX / count;
                    targetY = sumY / count;

                    // 움직임 영역 크기에 맞춰 줌인 수치 자동 계산 (최대 2.2배 줌)
                    let motionWidth = maxX - minX;
                    let motionHeight = maxY - minY;
                    let size = Math.max(motionWidth, motionHeight);
                    
                    targetZoom = Math.min(2.2, Math.max(1.3, width / (size * 1.6)));
                } else {
                    // 움직임이 없으면 천천히 기본 화면(줌 1.0, 중앙)으로 복귀
                    targetX = width / 2;
                    targetY = height / 2;
                    targetZoom = 1.0;
                }
            }

            prevGray = gray;

            // [방송 중계 효과] 화면이 뚝뚝 끊기지 않고 부드럽게 사물을 따라가도록 보정 (LERP)
            const ease = 0.08; 
            currentCamX += (targetX - currentCamX) * ease;
            currentCamY += (targetY - currentCamY) * ease;
            currentZoom += (targetZoom - currentZoom) * ease;

            // 화면을 벗어나지 않도록 클리핑 범위 제한
            let cropW = width / currentZoom;
            let cropH = height / currentZoom;
            let cropX = currentCamX - cropW / 2;
            let cropY = currentCamY - cropH / 2;

            cropX = Math.max(0, Math.min(width - cropW, cropX));
            cropY = Math.max(0, Math.min(height - cropH, cropY));

            // 최종 캔버스에 줌인된 영상 크롭해서 출력
            dispCtx.clearRect(0, 0, width, height);
            dispCtx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, width, height);

            // 타겟 조준선 시각 효과 (중계 화면 느낌)
            dispCtx.strokeStyle = 'rgba(255, 215, 0, 0.4)';
            dispCtx.lineWidth = 1.5;
            dispCtx.strokeRect(width / 2 - 40, height / 2 - 40, 80, 80);

            requestAnimationFrame(processFrame);
        }

        startCamera().then(() => {
            requestAnimationFrame(processFrame);
        });
    </script>
</body>
</html>
