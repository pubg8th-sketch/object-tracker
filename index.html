<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>드래그 선택 및 자동 줌 중계 시스템</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0b0b;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        h2 {
            margin: 10px 0 5px 0;
            font-size: 1.2rem;
            color: #4CAF50;
            text-align: center;
        }
        .controls {
            margin-bottom: 8px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            font-weight: bold;
            border: none;
            padding: 8px 16px;
            font-size: 0.9rem;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(76,175,80,0.3);
        }
        button:active {
            transform: scale(0.95);
        }
        .viewport {
            position: relative;
            width: 640px;
            height: 480px;
            max-width: 95vw;
            max-height: 70vh;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #333;
            background: #000;
            cursor: crosshair;
        }
        #displayCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        video, #processingCanvas {
            display: none;
        }
        .info {
            margin-top: 10px;
            font-size: 0.85rem;
            color: #aaa;
            text-align: center;
            padding: 0 15px;
        }
    </style>
</head>
<body>

    <h2>사물 드래그 선택 & 자동 줌 중계</h2>
    <div class="controls">
        <button id="switchCameraBtn">카메라 전환 (전면/후면)</button>
    </div>
    <div class="viewport" id="viewContainer">
        <canvas id="displayCanvas"></canvas>
    </div>
    <div class="info">화면에서 추적할 사물을 <strong>손가락으로 드래그하여 박스</strong>로 지정하세요!</div>

    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="processingCanvas"></canvas>

    <script>
        const video = document.getElementById('webcam');
        const procCanvas = document.getElementById('processingCanvas');
        const procCtx = procCanvas.getContext('2d');
        const dispCanvas = document.getElementById('displayCanvas');
        const dispCtx = dispCanvas.getContext('2d');
        const switchBtn = document.getElementById('switchCameraBtn');
        const viewContainer = document.getElementById('viewContainer');

        let currentStream = null;
        let useFrontCamera = true;

        // 드래그 선택 관련 변수
        let isDragging = false;
        let startX = 0, startY = 0;
        let endX = 0, endY = 0;
        let selectionBox = null; // {x, y, w, h}
        let targetColor = null;  // 선택한 영역의 평균 색상

        // 카메라 시점 및 줌 부드러운 보정용 변수
        let currentCamX = 320;
        let currentCamY = 240;
        let currentZoom = 1.0;

        async function startCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            const constraints = {
                video: {
                    width: { ideal: 640 },
                    height: { ideal: 480 },
                    facingMode: useFrontCamera ? 'user' : 'environment'
                }
            };

            try {
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;
                return new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        procCanvas.width = video.videoWidth;
                        procCanvas.height = video.videoHeight;
                        dispCanvas.width = video.videoWidth;
                        dispCanvas.height = video.videoHeight;
                        currentCamX = video.videoWidth / 2;
                        currentCamY = video.videoHeight / 2;
                        resolve();
                    };
                });
            } catch (err) {
                alert("카메라 권한을 얻을 수 없습니다.");
            }
        }

        switchBtn.addEventListener('click', async () => {
            useFrontCamera = !useFrontCamera;
            selectionBox = null;
            targetColor = null;
            await startCamera();
        });

        // --- 마우스 / 터치 드래그 이벤트 처리 ---
        function getCanvasCoords(clientX, clientY) {
            const rect = dispCanvas.getBoundingClientRect();
            const scaleX = dispCanvas.width / rect.width;
            const scaleY = dispCanvas.height / rect.height;
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        viewContainer.addEventListener('mousedown', (e) => {
            const pos = getCanvasCoords(e.clientX, e.clientY);
            isDragging = true;
            startX = pos.x; startY = pos.y;
            endX = pos.x; endY = pos.y;
        });

        viewContainer.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const pos = getCanvasCoords(e.clientX, e.clientY);
            endX = pos.x; endY = pos.y;
        });

        viewContainer.addEventListener('mouseup', () => {
            if (!isDragging) return;
            isDragging = false;
            finalizeSelection();
        });

        // 모바일/태블릿 터치 지원
        viewContainer.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) {
                const pos = getCanvasCoords(e.touches[0].clientX, e.touches[0].clientY);
                isDragging = true;
                startX = pos.x; startY = pos.y;
                endX = pos.x; endY = pos.y;
            }
        });

        viewContainer.addEventListener('touchmove', (e) => {
            if (!isDragging || e.touches.length === 0) return;
            const pos = getCanvasCoords(e.touches[0].clientX, e.touches[0].clientY);
            endX = pos.x; endY = pos.y;
        });

        viewContainer.addEventListener('touchend', () => {
            if (!isDragging) return;
            isDragging = false;
            finalizeSelection();
        });

        // 드래그가 끝났을 때 선택 영역 설정 및 색상 추출
        function finalizeSelection() {
            let x = Math.min(startX, endX);
            let y = Math.min(startY, endY);
            let w = Math.abs(endX - startX);
            let h = Math.abs(endY - startY);

            if (w < 10 || h < 10) return; // 너무 작게 드래그한 경우 무시

            selectionBox = { x, y, w, h };

            // 선택한 영역 안의 평균 색상 추출
            procCtx.drawImage(video, 0, 0, procCanvas.width, procCanvas.height);
            const imgData = procCtx.getImageData(x, y, w, h).data;
            let rSum = 0, gSum = 0, bSum = 0, count = 0;

            for (let i = 0; i < imgData.length; i += 16) { // 샘플링 추출
                rSum += imgData[i];
                gSum += imgData[i+1];
                bSum += imgData[i+2];
                count++;
            }

            targetColor = {
                r: rSum / count,
                g: gSum / count,
                b: bSum / count
            };
        }

        // --- 메인 렌더링 및 추적 루프 ---
        function processFrame() {
            if (video.paused || video.ended) return;

            const width = procCanvas.width;
            const height = procCanvas.height;

            procCtx.drawImage(video, 0, 0, width, height);

            let targetX = width / 2;
            let targetY = height / 2;
            let targetZoom = 1.0;

            // 사물이 지정되어 있으면 해당 색상을 추적하여 위치 파악
            if (targetColor && selectionBox) {
                const frameData = procCtx.getImageData(0, 0, width, height).data;
                let sumX = 0, sumY = 0, matchCount = 0;
                let minX = width, maxX = 0, minY = height, maxY = 0;
                const threshold = 70; // 색상 허용 오차

                // 직전 위치 주변을 우선 탐색하여 속도 유지
                const searchRadius = 150;
                const cx = selectionBox.x + selectionBox.w / 2;
                const cy = selectionBox.y + selectionBox.h / 2;
                const sX = Math.max(0, Math.floor(cx - searchRadius));
                const eX = Math.min(width, Math.floor(cx + searchRadius));
                const sY = Math.max(0, Math.floor(cy - searchRadius));
                const eY = Math.min(height, Math.floor(cy + searchRadius));

                for (let y = sY; y < eY; y += 4) {
                    for (let x = sX; x < eX; x += 4) {
                        let idx = (y * width + x) * 4;
                        let r = frameData[idx];
                        let g = frameData[idx + 1];
                        let b = frameData[idx + 2];

                        let diff = Math.abs(r - targetColor.r) + Math.abs(g - targetColor.g) + Math.abs(b - targetColor.b);
                        if (diff < threshold) {
                            sumX += x;
                            sumY += y;
                            matchCount++;
                            if (x < minX) minX = x;
                            if (x > maxX) maxX = x;
                            if (y < minY) minY = y;
                            if (y > maxY) maxY = y;
                        }
                    }
                }

                if (matchCount > 20) {
                    targetX = sumX / matchCount;
                    targetY = sumY / matchCount;

                    // 선택된 사물의 크기에 맞춰 줌인 배율 계산 (최대 2.5배)
                    let boxW = maxX - minX;
                    let boxH = maxY - minY;
                    let objSize = Math.max(boxW, boxH, 40);
                    targetZoom = Math.min(2.5, Math.max(1.2, width / (objSize * 1.8)));

                    // 추적 박스 업데이트
                    selectionBox.x = minX;
                    selectionBox.y = minY;
                    selectionBox.w = boxW;
                    selectionBox.h = boxH;
                }
            }

            // 부드러운 카메라 무빙 보정 (LERP)
            const ease = 0.08;
            currentCamX += (targetX - currentCamX) * ease;
            currentCamY += (targetY - currentCamY) * ease;
            currentZoom += (targetZoom - currentZoom) * ease;

            // 줌 영역 계산 및 클리핑
            let cropW = width / currentZoom;
            let cropH = height / currentZoom;
            let cropX = currentCamX - cropW / 2;
            let cropY = currentCamY - cropH / 2;

            cropX = Math.max(0, Math.min(width - cropW, cropX));
            cropY = Math.max(0, Math.min(height - cropH, cropY));

            // 화면에 줌인된 영상 출력
            dispCtx.clearRect(0, 0, width, height);
            dispCtx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, width, height);

            // 사용자가 드래그하는 중이면 드래그 박스 시각화
            if (isDragging) {
                dispCtx.strokeStyle = '#00FF00';
                dispCtx.lineWidth = 2;
                dispCtx.strokeRect(startX, startY, endX - startX, endY - startY);
            }

            requestAnimationFrame(processFrame);
        }

        startCamera().then(() => {
            requestAnimationFrame(processFrame);
        });
    </script>
</body>
</html>
