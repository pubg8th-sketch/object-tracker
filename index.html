<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>터치 물체 지정 및 예상 경로 추적</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: manipulation;
        }
        body {
            margin: 0;
            padding: 10px;
            background-color: #111;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h2 {
            margin: 5px 0 10px 0;
            font-size: 1.3rem;
            color: #4CAF50;
            text-align: center;
        }
        .controls {
            margin-bottom: 12px;
            display: flex;
            gap: 10px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 18px;
            font-size: 0.95rem;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        button:active {
            background-color: #3e8e41;
            transform: scale(0.98);
        }
        .container {
            position: relative;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #444;
            touch-action: none; /* 터치 스크롤 방지 */
            max-width: 100%;
        }
        video, canvas {
            display: block;
            width: 100%;
            max-width: 640px;
            height: auto;
            aspect-ratio: 4 / 3;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
        }
        .info {
            margin-top: 12px;
            font-size: 0.9rem;
            color: #ccc;
            text-align: center;
            line-height: 1.4;
        }
        .status {
            color: #FFD700;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>실시간 터치 물체 지정 & 경로 예측</h2>
    
    <div class="controls">
        <button id="switchCameraBtn">📷 카메라 전환 (전면/후면)</button>
        <button id="resetBtn" style="background-color: #e53935;">🔄 초기화</button>
    </div>

    <div class="container" id="videoContainer">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="outputCanvas"></canvas>
    </div>

    <div class="info">
        화면 속 물체를 <span class="status">손가락으로 터치</span>하여 지정하세요.<br>
        (🟢 현재 위치 / 🔴 붉은 점: 예상 이동 경로)
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('outputCanvas');
        const ctx = canvas.getContext('2d');
        const switchBtn = document.getElementById('switchCameraBtn');
        const resetBtn = document.getElementById('resetBtn');
        const container = document.getElementById('videoContainer');

        let currentStream = null;
        let useFrontCamera = true;
        
        let targetColor = null;
        let trackedObject = null;
        let historyPoints = [];

        // 카메라 시작
        async function startCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            const constraints = {
                video: {
                    width: { ideal: 640 },
                    height: { ideal: 480 },
                    facingMode: useFrontCamera ? 'user' : 'environment'
                }
            };

            try {
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;
                return new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        canvas.width = video.videoWidth || 640;
                        canvas.height = video.videoHeight || 480;
                        resolve();
                    };
                });
            } catch (err) {
                alert("카메라 접근 권한이 없거나 지원하지 않는 기기입니다.");
                console.error(err);
            }
        }

        // 터치 및 클릭 위치 처리 함수
        function handleSelect(e) {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            
            // 터치 이벤트와 마우스 이벤트 좌표 통일
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            // 태블릿 화면 크기에 맞춰 캔버스 내부 좌표 비율 계산
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            const touchX = (clientX - rect.left) * scaleX;
            const touchY = (clientY - rect.top) * scaleY;

            // 터치한 위치 주변 5x5 영역의 평균 색상 추출 (터치 정확도 향상)
            const sampleSize = 5;
            const startX = Math.max(0, Math.floor(touchX - sampleSize / 2));
            const startY = Math.max(0, Math.floor(touchY - sampleSize / 2));
            const pixelData = ctx.getImageData(startX, startY, sampleSize, sampleSize).data;

            let rSum = 0, gSum = 0, bSum = 0, count = 0;
            for (let i = 0; i < pixelData.length; i += 4) {
                rSum += pixelData[i];
                gSum += pixelData[i + 1];
                bSum += pixelData[i + 2];
                count++;
            }

            targetColor = {
                r: Math.round(rSum / count),
                g: Math.round(gSum / count),
                b: Math.round(bSum / count)
            };

            trackedObject = { x: touchX, y: touchY };
            historyPoints = [{ x: touchX, y: touchY }];
        }

        // 터치 및 마우스 이벤트 등록
        container.addEventListener('touchstart', handleSelect, { passive: false });
        container.addEventListener('mousedown', handleSelect);

        // 초기화 버튼
        resetBtn.addEventListener('click', () => {
            targetColor = null;
            trackedObject = null;
            historyPoints = [];
        });

        // 카메라 전환 버튼
        switchBtn.addEventListener('click', async () => {
            useFrontCamera = !useFrontCamera;
            targetColor = null;
            trackedObject = null;
            historyPoints = [];
            await startCamera();
        });

        // 프레임 연산 및 물체 추적
        function processVideo() {
            if (video.paused || video.ended) return;

            // 전면 카메라 사용 시 화면 거울 모드 좌우 반전 처리
            ctx.save();
            if (useFrontCamera) {
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
            }
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            ctx.restore();

            if (targetColor) {
                const frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = frame.data;
                const width = canvas.width;
                const height = canvas.height;

                let sumX = 0, sumY = 0, count = 0;
                const colorThreshold = 70; // 터치 인식을 위해 색상 오차 범위 최적화

                // 물체 탐색 영역 (이전 위치 기반 범위를 좁혀 빠른 추적)
                const searchRadius = 120;
                const startX = trackedObject ? Math.max(0, Math.floor(trackedObject.x - searchRadius)) : 0;
                const endX = trackedObject ? Math.min(width, Math.floor(trackedObject.x + searchRadius)) : width;
                const startY = trackedObject ? Math.max(0, Math.floor(trackedObject.y - searchRadius)) : 0;
                const endY = trackedObject ? Math.min(height, Math.floor(trackedObject.y + searchRadius)) : height;

                for (let y = startY; y < endY; y += 3) {
                    for (let x = startX; x < endX; x += 3) {
                        let idx = (y * width + x) * 4;
                        let r = data[idx];
                        let g = data[idx + 1];
                        let b = data[idx + 2];

                        let diff = Math.abs(r - targetColor.r) + Math.abs(g - targetColor.g) + Math.abs(b - targetColor.b);
                        if (diff < colorThreshold) {
                            sumX += x;
                            sumY += y;
                            count++;
                        }
                    }
                }

                if (count > 15) {
                    let cx = sumX / count;
                    let cy = sumY / count;
                    trackedObject = { x: cx, y: cy };

                    historyPoints.push({ x: cx, y: cy });
                    if (historyPoints.length > 8) {
                        historyPoints.shift();
                    }
                }
            }

            drawVisualizations();
            requestAnimationFrame(processVideo);
        }

        // 시각화 및 예상 붉은 점 생성
        function drawVisualizations() {
            if (historyPoints.length > 0) {
                let current = historyPoints[historyPoints.length - 1];

                // 1. 선택한 물체의 현재 위치 (초록색 원)
                ctx.beginPath();
                ctx.arc(current.x, current.y, 14, 0, 2 * Math.PI);
                ctx.strokeStyle = '#00FF00';
                ctx.lineWidth = 3;
                ctx.stroke();

                if (historyPoints.length >= 2) {
                    // 2. 속도 및 이동 방향 vector 계산
                    let dx = 0, dy = 0;
                    for (let i = 1; i < historyPoints.length; i++) {
                        dx += historyPoints[i].x - historyPoints[i-1].x;
                        dy += historyPoints[i].y - historyPoints[i-1].y;
                    }
                    dx /= (historyPoints.length - 1);
                    dy /= (historyPoints.length - 1);

                    // 3. 미래 예상 위치 붉은 점 표시
                    const predictionSteps = 12;
                    for (let step = 1; step <= predictionSteps; step++) {
                        let predX = current.x + dx * step * 1.5;
                        let predY = current.y + dy * step * 1.5;

                        ctx.beginPath();
                        ctx.arc(predX, predY, 4 + step * 0.4, 0, 2 * Math.PI);
                        ctx.fillStyle = `rgba(255, 0, 0, ${1 - step / (predictionSteps + 2)})`;
                        ctx.fill();
                    }
                }
            }
        }

        // 앱 시작
        startCamera().then(() => {
            requestAnimationFrame(processVideo);
        });
    </script>
</body>
</html>
