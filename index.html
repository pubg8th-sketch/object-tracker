<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 물체 이동 예측 및 추적</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h2 {
            margin-bottom: 10px;
            font-size: 1.5rem;
            color: #4CAF50;
        }
        .container {
            position: relative;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #333;
        }
        video, canvas {
            display: block;
            width: 640px;
            height: 480px;
            transform: scaleX(-1); /* 거울 모드 */
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
        }
        .info {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #aaa;
        }
    </style>
</head>
<body>

    <h2>실시간 물체 모션 및 예상 경로 추적</h2>
    <div class="container">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="outputCanvas"></canvas>
    </div>
    <div class="info">화면 앞에서 손이나 물체를 빠르게 움직여 보세요. (붉은 점: 예상 이동 경로)</div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('outputCanvas');
        const ctx = canvas.getContext('2d');

        let prevGray = null;
        let historyPoints = []; // 최근 위치 기록

        // 웹캠 연결 설정
        async function setupCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 640, height: 480 }
                });
                video.srcObject = stream;
                return new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        resolve(video);
                    };
                });
            } catch (err) {
                alert("웹캠 접근 권한이 거부되었거나 지원하지 않는 브라우저입니다.");
                console.error(err);
            }
        }

        // 그레이스케일 변환 및 움직임 중심점(Centroid) 계산
        function processVideo() {
            if (video.paused || video.ended) return;

            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = frame.data;

            // 성능을 위해 해상도 다운샘플링 (간격 4픽셀씩 건너뜀)
            const width = canvas.width;
            const height = canvas.height;
            let currentGray = new Uint8Array(width * height);

            for (let i = 0, p = 0; i < data.length; i += 4, p++) {
                // 상용 그레이스케일 공식
                currentGray[p] = (data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114);
            }

            if (prevGray) {
                let sumX = 0, sumY = 0, count = 0;
                const threshold = 35; // 변화 감지 임계값

                for (let y = 0; y < height; y += 4) {
                    for (let x = 0; x < width; x += 4) {
                        let idx = y * width + x;
                        let diff = Math.abs(currentGray[idx] - prevGray[idx]);
                        if (diff > threshold) {
                            sumX += x;
                            sumY += y;
                            count++;
                        }
                    }
                }

                // 움직임이 감지된 경우
                if (count > 100) {
                    let cx = sumX / count;
                    let cy = sumY / count;

                    historyPoints.push({ x: cx, y: cy });
                    if (historyPoints.length > 5) {
                        historyPoints.shift(); // 최근 5개 포인트 유지
                    }
                }
            }

            prevGray = currentGray;

            // 화면에 시각화 그리기
            drawVisualizations();

            requestAnimationFrame(processVideo);
        }

        // 현재 위치 및 예상 이동 경로(붉은 점) 그리기
        function drawVisualizations() {
            if (historyPoints.length < 2) return;

            // 1. 현재 감지된 중심점 표시
            let current = historyPoints[historyPoints.length - 1];
            ctx.beginPath();
            ctx.arc(current.x, current.y, 8, 0, 2 * Math.PI);
            ctx.fillStyle = '#00FF00'; // 초록색: 현재 물체 위치
            ctx.fill();

            // 2. 속도 및 방향 벡터 계산 (최근 이동 평균)
            let dx = 0, dy = 0;
            for (let i = 1; i < historyPoints.length; i++) {
                dx += historyPoints[i].x - historyPoints[i-1].x;
                dy += historyPoints[i].y - historyPoints[i-1].y;
            }
            dx /= (historyPoints.length - 1);
            dy /= (historyPoints.length - 1);

            // 3. 미래 예상 경로를 붉은 점으로 예측 출력
            const predictionSteps = 10; // 몇 프레임 앞을 예측할 것인가
            for (let step = 1; step <= predictionSteps; step++) {
                let predX = current.x + dx * step * 1.5;
                let predY = current.y + dy * step * 1.5;

                ctx.beginPath();
                ctx.arc(predX, predY, 5 + step * 0.5, 0, 2 * Math.PI);
                ctx.fillStyle = `rgba(255, 0, 0, ${1 - step / (predictionSteps + 2)})`; // 점점 투명해지는 붉은 점
                ctx.fill();
            }
        }

        // 실행 시작
        setupCamera().then(() => {
            requestAnimationFrame(processVideo);
        });
    </script>
</body>
</html>
