<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>지정 사물 자동 줌 중계 시스템</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0b0b;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }
        h2 {
            margin: 10px 0 5px 0;
            font-size: 1.2rem;
            color: #00FFCC;
            text-shadow: 0 0 5px rgba(0,255,204,0.5);
            text-align: center;
        }
        .controls {
            margin-bottom: 8px;
        }
        button {
            background-color: #00FFCC;
            color: #111;
            font-weight: bold;
            border: none;
            padding: 8px 16px;
            font-size: 0.9rem;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,255,204,0.3);
        }
        button:active {
            transform: scale(0.95);
        }
        .viewport {
            position: relative;
            width: 640px;
            height: 480px;
            max-width: 95vw;
            max-height: 70vh;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #333;
            background: #000;
        }
        #displayCanvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: crosshair;
        }
        video, #processingCanvas {
            display: none;
        }
        .badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(0, 255, 204, 0.8);
            color: #000;
            padding: 4px 8px;
            font-size: 0.75rem;
            font-weight: bold;
            border-radius: 4px;
            letter-spacing: 1px;
        }
        .info {
            margin-top: 8px;
            font-size: 0.85rem;
            color: #888;
            text-align: center;
            padding: 0 10px;
        }
    </style>
</head>
<body>

    <h2>사물 지정 자동 줌 중계</h2>
    <div class="controls">
        <button id="switchCameraBtn">카메라 전환 (전면/후면)</button>
    </div>
    <div class="viewport">
        <div class="badge" id="statusBadge">터치하여 사물 선택</div>
        <canvas id="displayCanvas"></canvas>
    </div>
    <div class="info">화면에서 따라가고 싶은 <strong>사물을 터치</strong>하세요. 해당 사물을 중심으로 자동 줌인됩니다.</div>

    <!-- 비공개 연산용 엘리먼트 -->
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="processingCanvas"></canvas>

    <script>
        const video = document.getElementById('webcam');
        const procCanvas = document.getElementById('processingCanvas');
        const procCtx = procCanvas.getContext('2d');
        const dispCanvas = document.getElementById('displayCanvas');
        const dispCtx = dispCanvas.getContext('2d');
        const switchBtn = document.getElementById('switchCameraBtn');
        const statusBadge = document.getElementById('statusBadge');

        let currentStream = null;
        let useFrontCamera = true;

        let targetColor = null; // 사용자가 지정한 사물 색상
        let trackedObject = null; // 현재 지정된 사물 위치 {x, y}

        // 부드러운 카메라 이동 및 줌을 위한 변수
        let currentCamX = 320;
        let currentCamY = 240;
        let currentZoom = 1.0;

        async function startCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            const constraints = {
                video: {
                    width: { ideal: 640 },
                    height: { ideal: 480 },
                    facingMode: useFrontCamera ? 'user' : 'environment'
                }
            };

            try {
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;
                return new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        procCanvas.width = video.videoWidth;
                        procCanvas.height = video.videoHeight;
                        dispCanvas.width = video.videoWidth;
                        dispCanvas.height = video.videoHeight;
                        currentCamX = video.videoWidth / 2;
                        currentCamY = video.videoHeight / 2;
                        resolve();
                    };
                });
            } catch (err) {
                alert("카메라 권한을 얻을 수 없습니다.");
            }
        }

        switchBtn.addEventListener('click', async () => {
            useFrontCamera = !useFrontCamera;
            targetColor = null;
            trackedObject = null;
            statusBadge.innerText = "터치하여 사물 선택";
            statusBadge.style.background = "rgba(0, 255, 204, 0.8)";
            await startCamera();
        });

        // 화면 터치/클릭 시 해당 위치의 사물 색상 추출
        function handleTouchOrClick(clientX, clientY) {
            const rect = dispCanvas.getBoundingClientRect();
            const scaleX = dispCanvas.width / rect.width;
            const scaleY = dispCanvas.height / rect.height;

            // 현재 줌인/크롭된 상태를 고려하여 실제 원본 비디오 좌표 계산
            const viewW = dispCanvas.width / currentZoom;
            const viewH = dispCanvas.height / currentZoom;
            const viewX = currentCamX - viewW / 2;
            const viewY = currentCamY - viewH / 2;

            const clickX = viewX + (clientX - rect.left) * scaleX * (viewW / dispCanvas.width);
            const clickY = viewY + (clientY - rect.top) * scaleY * (viewH / dispCanvas.height);

            // 주변 5x5 영역의 평균 색상 추출 (인식률 향상)
            const sampleSize = 5;
            const startX = Math.max(0, Math.floor(clickX - sampleSize));
            const startY = Math.max(0, Math.floor(clickY - sampleSize));
            const pWidth = sampleSize * 2;
            const pHeight = sampleSize * 2;

            const pixelData = procCtx.getImageData(startX, startY, pWidth, pHeight).data;
            let rSum = 0, gSum = 0, bSum = 0, total = 0;

            for (let i = 0; i < pixelData.length; i += 4) {
                rSum += pixelData[i];
                gSum += pixelData[i+1];
                bSum += pixelData[i+2];
                total++;
            }

            targetColor = { r: rSum / total, g: gSum / total, b: bSum / total };
            trackedObject = { x: clickX, y: clickY };

            statusBadge.innerText = "● TRACKING ACTIVE";
            statusBadge.style.background = "rgba(255, 0, 0, 0.8)";
        }

        dispCanvas.addEventListener('click', (e) => {
            handleTouchOrClick(e.clientX, e.clientY);
        });

        dispCanvas.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) {
                const touch = e.touches[0];
                handleTouchOrClick(touch.clientX, touch.clientY);
                e.preventDefault();
            }
        }, { passive: false });

        // 메인 루프: 지정된 사물 추적 및 자동 줌 처리
        function processFrame() {
            if (video.paused || video.ended) return;

            const width = procCanvas.width;
            const height = procCanvas.height;

            procCtx.drawImage(video, 0, 0, width, height);
            const frame = procCtx.getImageData(0, 0, width, height);
            const data = frame.data;

            let targetX = currentCamX;
            let targetY = currentCamY;
            let targetZoom = 1.0;

            if (targetColor && trackedObject) {
                let sumX = 0, sumY = 0, count = 0;
                const colorThreshold = 75; // 색상 오차 허용 범위
                const searchRadius = 120;  // 사물 주변 탐색 반경

                const startX = Math.max(0, Math.floor(trackedObject.x - searchRadius));
                const endX = Math.min(width, Math.floor(trackedObject.x + searchRadius));
                const startY = Math.max(0, Math.floor(trackedObject.y - searchRadius));
                const endY = Math.min(height, Math.floor(trackedObject.y + searchRadius));

                for (let y = startY; y < endY; y += 3) {
                    for (let x = startX; x < endX; x += 3) {
                        let idx = (y * width + x) * 4;
                        let r = data[idx];
                        let g = data[idx + 1];
                        let b = data[idx + 2];

                        let diff = Math.abs(r - targetColor.r) + Math.abs(g - targetColor.g) + Math.abs(b - targetColor.b);
                        if (diff < colorThreshold) {
                            sumX += x;
                            sumY += y;
                            count++;
                        }
                    }
                }

                // 사물을 찾은 경우 위치 업데이트 및 자동 줌인 적용
                if (count > 15) {
                    targetX = sumX / count;
                    targetY = sumY / count;
                    trackedObject = { x: targetX, y: targetY };
                    targetZoom = 2.0; // 지정한 사물이 들어오도록 2배 줌인 고정
                } else {
                    // 일시적으로 사물을 놓치면 마지막 위치 유지
                    targetX = trackedObject.x;
                    targetY = trackedObject.y;
                    targetZoom = 2.0;
                }
            } else {
                // 사물을 지정하기 전에는 기본 화면
                targetX = width / 2;
                targetY = height / 2;
                targetZoom = 1.0;
            }

            // 부드러운 카메라 무빙(LERP) 처리
            const ease = 0.1;
            currentCamX += (targetX - currentCamX) * ease;
            currentCamY += (targetY - currentCamY) * ease;
            currentZoom += (targetZoom - currentZoom) * ease;

            // 화면 이탈 방지 크롭 영역 계산
            let cropW = width / currentZoom;
            let cropH = height / currentZoom;
            let cropX = currentCamX - cropW / 2;
            let cropY = currentCamY - cropH / 2;

            cropX = Math.max(0, Math.min(width - cropW, cropX));
            cropY = Math.max(0, Math.min(height - cropH, cropY));

            // 최종 화면에 줌인/크롭된 영상 출력
            dispCtx.clearRect(0, 0, width, height);
            dispCtx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, width, height);

            requestAnimationFrame(processFrame);
        }

        startCamera().then(() => {
            requestAnimationFrame(processFrame);
        });
    </script>
</body>
</html>
